<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" fill="none" width="100%" height="100%">
  <defs>
    <!-- Orange Glow Filter -->
    <filter id="beacon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for 3D Cube Facets -->
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff772e"/>
      <stop offset="100%" stop-color="#e64a00"/>
    </linearGradient>

    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc3f00"/>
      <stop offset="100%" stop-color="#942c00"/>
    </linearGradient>

    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e64f05"/>
      <stop offset="100%" stop-color="#b33600"/>
    </linearGradient>

    <!-- Hexagon Border Gradient -->
    <linearGradient id="hex-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#daf2fd" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#80c8e8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- ============================================== -->
  <!-- 1. HEXAGONAL TRANSIT EMBLEM (ICON)             -->
  <!-- ============================================== -->
  <g transform="translate(4, 4)">
    <!-- Hexagonal Background & Border -->
    <polygon
      points="18,2 33,10.6 33,27.4 18,36 3,27.4 3,10.6"
      fill="#051715"
      stroke="url(#hex-stroke)"
      stroke-width="2.2"
      stroke-linejoin="round"
    />

    <!-- Inner 3D Isometric Cargo Cube -->
    <!-- Top Face -->
    <polygon
      points="18,8.5 28.5,14.5 18,20.5 7.5,14.5"
      fill="url(#cube-top)"
    />
    <!-- Left Face -->
    <polygon
      points="7.5,14.5 18,20.5 18,31 7.5,25"
      fill="url(#cube-left)"
    />
    <!-- Right Face -->
    <polygon
      points="18,20.5 28.5,14.5 28.5,25 18,31"
      fill="url(#cube-right)"
    />

    <!-- Glowing Satellite Telemetry Beacon at Top-Right -->
    <circle
      cx="33"
      cy="4.5"
      r="4.2"
      fill="#ff5500"
      filter="url(#beacon-glow)"
    />
    <circle
      cx="33"
      cy="4.5"
      r="2"
      fill="#fff4e6"
    />
  </g>

  <!-- ============================================== -->
  <!-- 2. WORDMARK: "LogiSyncPRO"                     -->
  <!-- ============================================== -->
  <g transform="translate(52, 29)">
    <!-- "LogiSync" Text -->
    <text
      x="0"
      y="0"
      fill="#c5eaf8"
      font-family="'Unbounded', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="20.5"
      letter-spacing="-0.03em"
    >LogiSync</text>

    <!-- "PRO" Integrated Accent -->
    <text
      x="121"
      y="0"
      fill="#ff5500"
      font-family="'Unbounded', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="20.5"
      letter-spacing="-0.02em"
    >PRO</text>
  </g>
</svg>
